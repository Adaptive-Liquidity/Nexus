name: Publish Docker image

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  NEXUS_IMAGE: ghcr.io/adaptiveliquidity/nexusiq-nexus

jobs:
  publish-nexus:
    name: Publish Nexus Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless (GitHub OIDC)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.NEXUS_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # docker/Dockerfile.nexus builds the three kit binaries (nexus,
      # nexus-agentd, nexus-mcp) with --features aeon-memory on digest-pinned
      # bookworm bases. It is committed here (not gitignored) so this workflow
      # is self-contained; the Nexus-IQ kit vendors an identical copy at the
      # same path (see that file's header for the sync note). Do NOT point
      # this at `Dockerfile.nexusiq` — that filename is a gitignored artifact
      # install.sh generates locally and is never present in a fresh checkout.
      - name: Build and push Nexus image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.nexus
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Nexus image (keyless, by digest)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${NEXUS_IMAGE}@${DIGEST}"
